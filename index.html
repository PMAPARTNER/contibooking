<title>Conti Rapor Panosu</title>
<style>
  :root{
    --bar-h: 64px;
    --bar-bg-1: #050b16;
    --bar-bg-2: #0d1f38;
    --bar-line: rgba(255,255,255,.08);
    --ink: #ffffff;
    --muted: #93a8c2;
    --bd-accent: #14b8b0;
    --bc-accent: #e08a2b;
    --panel-bg: #0a1120;
    --page-bg: #060b14;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--page-bg);
    font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
    color:var(--ink);
    overflow-x:hidden;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky;
    top:env(safe-area-inset-top,0px);
    z-index:1000;
    height:var(--bar-h);
    display:flex;
    align-items:center;
    gap:18px;
    padding:0 20px;
    background:linear-gradient(120deg,var(--bar-bg-1) 0%,var(--bar-bg-2) 100%);
    border-bottom:1px solid var(--bar-line);
    box-shadow:0 4px 18px rgba(0,0,0,.35);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    flex-shrink:0;
  }
  .brand img{
    height:30px;
    width:auto;
    display:block;
    filter:drop-shadow(0 1px 3px rgba(0,0,0,.4));
  }
  .brand-div{
    width:1px;
    height:26px;
    background:rgba(255,255,255,.18);
  }
  .brand-txt{
    display:flex;
    flex-direction:column;
    line-height:1.2;
  }
  .brand-txt .t1{
    font-size:13px;
    font-weight:700;
    color:#fff;
    letter-spacing:.2px;
  }
  .brand-txt .t2{
    font-size:10.5px;
    font-weight:500;
    color:var(--muted);
    letter-spacing:.4px;
    text-transform:uppercase;
  }

  .tabs{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:4px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1);
    border-radius:10px;
    padding:4px;
    flex-shrink:0;
  }
  .tab{
    appearance:none;
    border:none;
    background:transparent;
    color:var(--muted);
    font-size:12.5px;
    font-weight:700;
    padding:8px 14px;
    border-radius:7px;
    cursor:pointer;
    white-space:nowrap;
    display:flex;
    align-items:center;
    gap:7px;
    transition:background .15s,color .15s;
  }
  .tab .dot{
    width:7px;height:7px;border-radius:50%;
    background:currentColor;
    opacity:.55;
  }
  .tab:hover{color:#fff;}
  .tab.on{background:#fff;color:#0b1220;}
  .tab.on .dot{opacity:1;}
  .tab[data-tab="bd"].on{color:var(--bd-accent);}
  .tab[data-tab="bc"].on{color:var(--bc-accent);}

  @media (max-width:720px){
    .topbar{padding:0 12px;gap:10px;}
    .brand-txt .t2{display:none;}
    .tab{padding:8px 10px;font-size:11.5px;}
  }
  @media (max-width:480px){
    .brand-div{display:none;}
    .brand-txt{display:none;}
  }

  /* ---------- Content ---------- */
  .stage{
    height:calc(100vh - var(--bar-h) - env(safe-area-inset-top,0px));
  }
  .compare{
    display:none;
    height:100%;
    grid-template-columns:1fr 1fr;
    gap:2px;
    background:var(--bar-line);
  }
  .compare.on{display:grid;}
  .pane{
    display:none;
    height:100%;
    flex-direction:column;
    background:var(--panel-bg);
    min-width:0;
  }
  .pane.on{display:flex;}
  .compare .pane{display:flex;}

  .pane-head{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 18px;
    background:var(--panel-bg);
    border-bottom:2px solid var(--pane-accent, #333);
  }
  .pane[data-hotel="bd"]{--pane-accent:var(--bd-accent);}
  .pane[data-hotel="bc"]{--pane-accent:var(--bc-accent);}
  .pane-head .sw{
    width:9px;height:9px;border-radius:50%;
    background:var(--pane-accent);
    flex-shrink:0;
  }
  .pane-head .nm{
    font-size:12.5px;
    font-weight:800;
    letter-spacing:.3px;
    color:#fff;
  }
  .pane-head .loc{
    font-size:11px;
    color:var(--muted);
    margin-left:auto;
    white-space:nowrap;
  }
  .pane-body{
    flex:1;
    min-height:0;
  }
  .pane-body iframe{
    width:100%;
    height:100%;
    border:0;
    display:block;
    background:#fff;
  }

  .single-wrap{
    display:none;
    height:100%;
  }
  .single-wrap.on{display:flex;flex-direction:column;}

  @media (max-width:900px){
    .compare.on{
      display:flex;
      flex-direction:column;
      height:auto;
      overflow-y:auto;
    }
    .stage{height:calc(100vh - var(--bar-h));overflow-y:auto;}
    .compare .pane{height:82vh;flex-shrink:0;}
    .compare .pane + .pane{border-top:3px solid var(--bar-line);}
  }
</style>
